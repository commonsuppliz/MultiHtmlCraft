<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTMLフォーム POST サンプル</title>
</head>
<body>

    <h1>ユーザー情報登録フォーム</h1>
    
    <!-- POSTメソッドのフォーム -->
    <form action="FormResult.aspx" method="POST">
        
        <!-- テキスト入力 -->
        <label for="name">名前：</label>
        <input type="text" id="name" name="name" required><br><br>
        
        <!-- メールアドレス -->
        <label for="email">メールアドレス：</label>
        <input type="email" id="email" name="email" required><br><br>
        
        <!-- パスワード -->
        <label for="password">パスワード：</label>
        <input type="password" id="password" name="password" required><br><br>
        
        <!-- 選択肢（ラジオボタン） -->
        <p>性別：</p>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">男性</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">女性</label><br><br>
        
        <!-- 複数選択（チェックボックス） -->
        <label>興味のある分野：</label><br>
        <input type="checkbox" id="tech" name="interests" value="technology">
        <label for="tech">技術</label>
        <input type="checkbox" id="music" name="interests" value="music">
        <label for="music">音楽</label>
        <input type="checkbox" id="sport" name="interests" value="sport">
        <label for="sport">スポーツ</label><br><br>
        
        <!-- テキストエリア -->
        <label for="message">メッセージ：</label><br>
        <textarea id="message" name="message" rows="4" cols="50"></textarea><br><br>
        
        <!-- 送信ボタン -->
        <button type="submit">送信する</button>
        
    </form>

</body>
</html>
