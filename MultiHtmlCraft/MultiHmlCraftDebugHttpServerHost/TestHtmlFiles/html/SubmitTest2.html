<html>
<head>
    <meta charset="UTF-8" />
</head>
<form action="submit.aspx" method="POST" enctype="multipart/form-data">
  <input type="text" id="text" style="background-color:#e3f2fd;" />/><br/><br/>
  <input type="password" id="password" style="background-color:#fce4ec;" />/><br/><br/>
  <input type="checkbox" id="checkbox" style="background-color:#e8f5e9;" />/><br/><br/>
  <input type="radio" id="radio" style="background-color:#fff3e0;" />/><br/><br/>
  <input type="reset" id="reset" value="Reset" style="background-color:#f3e5f5;" />/><br/><br/>
  <input type="file" id="file" style="background-color:#e0f7fa;" />/><br/><br/>
  <input type="hidden" id="hidden" value="hiddenValue" style="background-color:#f5f5f5;" />/><br/><br/>
  <input type="image" id="imagesrc" src="https://via.placeholder.com/40x20" alt="Image" style="background-color:#ffe0b2;" />/><br/><br/>
  <input type="date" id="date" style="background-color:#f9fbe7;" />/><br/><br/>
  <input type="datetime-local" id="datetime" style="background-color:#e1f5fe;" />/><br/><br/>
  <input type="email" id="email" style="background-color:#f8bbd0;" />/><br/><br/>
  <input type="month" id="month" style="background-color:#dcedc8;" />/><br/><br/>
  <input type="number" id="number" style="background-color:#ffe082;" />/><br/><br/>
  <input type="range" id="range" style="background-color:#b2dfdb;" />/><br/><br/>
  <input type="search" id="search" style="background-color:#cfd8dc;" />/><br/><br/>
  <input type="tel" id="tel" style="background-color:#f0f4c3;" />/><br/><br/>
  <input type="time" id="time" style="background-color:#d1c4e9;" />/><br/><br/>
  <input type="url" id="url" style="background-color:#bbdefb;" />/><br/><br/>
  <input type="week" id="week" style="background-color:#ffe0e6;" />/><br/><br/>
  <input type="color" id="color" style="background-color:#ffffff;" />/><br/><br/>
  <input type="submit" value="Submit" style="background-color:#c8e6c9;" id="submitButton" />/><br/><br/>
</form>
