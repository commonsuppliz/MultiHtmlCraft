<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebP Image Example</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
            line-height: 1.6;
        }
        .image-container {
            max-width: 600px;
        }
    </style>
</head>
<body>

    <h1>Welcome to My Page</h1>
    
    <p>This is a sample implementation of a WebP image within an HTML document:</p>

    <div class="image-container">
        <img src="sample-image.webp" alt="A descriptive alt text for accessibility" width="600" height="400">
    </div>

    <hr>

    <h3>Recommended Approach (with Fallback)</h3>
    <p>To ensure compatibility across all environments, you can use the picture element:</p>

    <div class="image-container">
        <picture>
            <source srcset="sample-image.webp" type="image/webp">
            <img src="sample-image.jpg" alt="A descriptive alt text for accessibility" width="600" height="400">
        </picture>
    </div>

</body>
</html>
