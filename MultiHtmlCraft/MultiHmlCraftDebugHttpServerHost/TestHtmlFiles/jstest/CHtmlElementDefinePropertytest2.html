<body>

<div id="testObj"></div>


<script>
  var testElement = undefined;
  try{
  testElement= document.getElementById("testObj");
  console.log('resutof document.getElementById : ' + testElement);
  } 
  catch(e)
  {
         console.log('document getElementById has Error');
  }
  try
  {
     var resultProp1 = testElement.Propety1;
     console.log("Current testElement.Propety1 " + resultProp1);
  } catch(e)
  {
        console.log('can not access to testElement.property1');

  try
  {
     console.log('calling definPproperty');

       console.log('defineProperty() called sucess!');

     console.log('definepPoperty set Error : ' + e.message);
  }

</script>
