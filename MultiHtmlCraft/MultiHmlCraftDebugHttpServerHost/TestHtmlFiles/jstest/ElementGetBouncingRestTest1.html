<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>複数の要素で getBoundingClientRect サンプル (for文使用)</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
            height: 1500px; /* スクロール確認用の余白 */
        }
        .box {
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            margin-bottom: 30px;
            border-radius: 6px;
        }
        #box1 {
            width: 200px;
            height: 80px;
            background-color: #3498db;
        }
        #box2 {
            width: 300px;
            height: 120px;
            background-color: #e74c3c;
            margin-left: 150px; /* 右にずらす */
        }
        #box3 {
            width: 150px;
            height: 150px;
            background-color: #2ecc71;
            position: fixed; /* 画面右下に固定 */
            bottom: 20px;
            right: 20px;
            margin-bottom: 0;
        }
    </style>
</head>
<body>

    <div id="box1" class="box">要素 1 (左上)</div>
    <div id="box2" class="box">要素 2 (中央寄り)</div>
    <div id="box3" class="box">要素 3 (右下固定)</div>

    <script>
        // クラス名 'box' を持つすべての要素を取得
        const el = document.querySelector('.box');
        const rect = el.getBoundingClientRect();
        console.log("rect :" , rect.width, rect.height);
        try
        {
           const firstElement =  document.querySelectorAll('.box').item(0);
           console.log("firstElement id: " + firstElement.id);
        } catch{}
        const elements = document.querySelectorAll('.box');
        console.log("elements length : " + elements.length);
        // for...of ループを使用して各要素を処理
        var currentPos = 0;
        for (const el of elements) {
				console.log("loop el:", el);
				console.log("loop typeof el.getBoundingClientRect:", typeof el.getBoundingClientRect);

				if (typeof el.getBoundingClientRect === "function") {
				    const rect = el.getBoundingClientRect();
				    console.log("rect type:", typeof rect);
				} else {
				    console.log("getBoundingClientRect is NOT a function on el");
				}
            console.log("typeof el.getBoundingClientRect:", typeof el.getBoundingClientRect);
            console.log("el id: " + el.id);
            const rect = el.getBoundingClientRect();

            console.log(`=== ${el.id} (${el.textContent}) ===`);
            console.log(rect);
            console.log(`loop CurentPos ${currentPos} 位置: top=${rect.top}, left=${rect.left} / サイズ: ${rect.width}x${rect.height}`);
            currentPos ++;
        }
    </script>

</body>
</html>
