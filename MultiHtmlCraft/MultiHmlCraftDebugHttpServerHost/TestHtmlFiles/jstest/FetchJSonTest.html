<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Fetch Stream Monitoring</title>
</head>
<body>

    <h2>ストリーム受信（監視）モード</h2>
    <div id="status">待機中...</div>
    <progress id="progress" value="0" max="100" style="display:none;"></progress>
    <pre id="output"></pre>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const output = document.getElementById('output');
            const status = document.getElementById('status');
            const progress = document.getElementById('progress');

            try {
                console.log("--- 1: リクエスト開始 (XHRの OPEN に相当) ---");
                const response = await fetch('https://jsonplaceholder.typicode.com/photos'); // 少し重めのデータ

                if (!response.ok) throw new Error("Network response was not ok");

                // ストリームの読み取り開始
                const reader = response.body.getReader();
                const contentLength = +response.headers.get('Content-Length'); // 全体サイズ（あれば）
                
                console.log("--- 2: 受信開始 (XHRの LOADING に相当) ---");
                status.textContent = "データ受信中...";
                progress.style.display = "block";

                let receivedLength = 0;
                let chunks = []; 

                // 無限ループでデータが届くのを待つ
                while(true) {
                    const {done, value} = await reader.read();

                    if (done) {
                        console.log("--- 3: 受信完了 (XHRの DONE に相当) ---");
                        break;
                    }

                    chunks.push(value);
                    receivedLength += value.length;

                    // 進捗を表示（Content-Lengthがある場合）
                    if (contentLength) {
                        const percent = Math.round((receivedLength / contentLength) * 100);
                        progress.value = percent;
                    }
                    
                    console.log(`受信中... ${receivedLength} バイト届きました`);
                }

                // すべてのチャンクを結合してテキスト（JSON）に変換
                const allChunks = new Uint8Array(receivedLength);
                let position = 0;
                for(let chunk of chunks) {
                    allChunks.set(chunk, position);
                    position += chunk.length;
                }

                const result = new TextDecoder("utf-8").decode(allChunks);
                const data = JSON.parse(result);

                // 最初の3件だけ表示
                output.textContent = JSON.stringify(data.slice(0, 3), null, 2);
                status.textContent = "✅ すべてのロードが完了しました！";

            } catch (error) {
                console.error("エラー:", error);
                status.textContent = "❌ 失敗しました";
            }
        });
    </script>
</body>
</html>
