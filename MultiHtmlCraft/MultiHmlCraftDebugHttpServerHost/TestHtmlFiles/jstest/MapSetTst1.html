<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ノードの追加</title>

</head>
<body>

<p>今日は外でランチを食べました。</p>


<script>
const map1 = new Map();
map1.set("bar", "foo");

console.log(map1.get("bar"));
// Expected output: "foo"

console.log(map1.get("baz"));
// Expected output: undefined
</script>
</body>
</html>
