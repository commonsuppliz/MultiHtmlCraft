<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>requestAnimationFrame Example</title>
  <style>
    #box {
      width: 50px;
      height: 50px;
      background: #4caf50;
      position: absolute;
      left: 0;
      top: 50px;
    }
  </style>
</head>
<body>
  <div id="box"></div>
  <script>
    let box = document.getElementById('box');
    let pos = 0;

    function animate() {
      pos += 2;
      box.style.left = pos + 'px';
      if (pos < 100) {
        requestAnimationFrame(animate);
      }
    }

    animate();
  </script>
</body>
</html>
