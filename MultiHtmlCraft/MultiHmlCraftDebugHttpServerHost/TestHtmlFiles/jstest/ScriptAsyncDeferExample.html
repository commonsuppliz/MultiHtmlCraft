<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <script async src="asyncscript.js" type="text/javascript"></script>
  <script defer src="deferscript.js" type="text/javascript"></script>
</head>
<body>
  <h1>Async/Defer Script Sample</h1>
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      console.log("DOMContentLoadedイベント発生");
    });
  </script>
</body>
</html>
