<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Mousedown Position</title>
    <style>
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f0f0f0;
        }
        .box {
            width: 300px;
            height: 300px;
            background-color: skyblue;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid #333;
        }
    </style>
</head>
<body>

    <div class="box">ここをクリックして</div>

    <script>
        // document全体、または特定の要素に対してイベントリスナーを設定します
        window.addEventListener('mousedown', (event) => {
            // クライアント座標（ブラウザの表示領域内の位置）を取得
            const x = event.clientX;
            const y = event.clientY;

            console.log(x + " : " + y);
        });
    </script>
</body>
</html>
