<body>

<div id="box" style="width: 200px; background-color: blue;"></div>

<script>
const box = document.getElementById("box");

  // element.style でも getPropertyValue が使える
  console.log(box.style.getPropertyValue("background-color")); // 出力: "red"
  console.log(box.style.getPropertyValue("width"));
</script>
</body>
