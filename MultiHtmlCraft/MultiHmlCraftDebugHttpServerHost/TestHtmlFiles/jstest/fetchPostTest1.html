<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOMContentLoaded と fetch (POST) のサンプル</title>
</head>
<body>
    <h1>DOMContentLoadedで自動POSTするサンプル</h1>
    <p>ページが読み込まれた瞬間に、自動でPOSTリクエストを送信します。開発者ツールのコンソールを確認してください。</p>

    <script>
        // DOMの構築が完了したタイミングで自動実行
        window.addEventListener('DOMContentLoaded', async () => {
            console.log('DOMContentLoaded: DOMの読み込みが完了しました。POSTリクエストを開始します...');

            // 送信したいデータ（オブジェクト）
            const postData = {
                title: 'postTitle',
                body: 'postBody String',
                userId: 1
            };

            try {
                // fetch関数でPOSTリクエストを送信
                const response = await fetch('https://jsonplaceholder.typicode.com/posts', {
                    method: 'POST', // メソッドをPOSTに指定
                    headers: {
                        'Content-Type': 'application/json; charset=UTF-8',
                        'Auth': 'xogehoge',
                        'referer' : 'http:localhost',
                        'fetchoptions' : 'data, locations'
                    },
                    body: JSON.stringify(postData) // オブジェクトをJSON文字列に変換
                });

                // HTTPステータスが200番台以外の場合
                if (!response.ok) {
                    throw new Error(`HTTPエラー! ステータス: ${response.status}`);
                }

                // レスポンスのJSONデータを取得
                const data = await response.json();

                // 成功結果をコンソールに出力
                console.log('POST送信成功:', data);

            } catch (error) {
                // エラー時のハンドリング
                console.error('POST送信に失敗しました:', error);
            }
        });
    </script>
</body>
</html>
